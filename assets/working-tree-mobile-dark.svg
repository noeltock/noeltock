<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Noel Tock working tree</title>
  <desc id="desc">A compact working tree connects the agents, WordPress, and creative branches to Prompt Relay, Block Runner, and Asciara.</desc>
  <style>
    .ink { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .line { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-linecap: square; }
    .accent { fill: #58a6ff; }
    .branch { fill: none; stroke: #58a6ff; stroke-width: 1.5; stroke-linecap: square; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; }
    .small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .08em; }
    .cursor { animation: scan 12s ease-in-out infinite; }
    @keyframes scan { 0%, 14% { transform: translateY(0); } 48%, 62% { transform: translateY(170px); } 100% { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="720" height="340" fill="#0d1117"/>
  <text x="42" y="42" class="small muted">HEAD / noeltock</text>
  <text x="42" y="68" class="label ink">working-tree/</text>
  <path d="M84 101V288M84 118H644M84 194H644M84 270H644" class="line"/>
  <path d="M84 118H644M84 194H644M84 270H644" class="branch"/>
  <circle cx="84" cy="118" r="4" class="accent"/>
  <circle cx="84" cy="194" r="4" class="accent"/>
  <circle cx="84" cy="270" r="4" class="accent"/>
  <circle cx="644" cy="118" r="3" class="accent"/>
  <circle cx="644" cy="194" r="3" class="accent"/>
  <circle cx="644" cy="270" r="3" class="accent"/>
  <g class="cursor"><rect x="81" y="101" width="6" height="20" class="accent"/></g>
  <text x="112" y="113" class="label ink">agents/</text>
  <text x="350" y="113" class="label muted">Prompt Relay</text>
  <text x="112" y="189" class="label ink">wordpress/</text>
  <text x="350" y="189" class="label muted">Block Runner</text>
  <text x="112" y="265" class="label ink">creative/</text>
  <text x="350" y="265" class="label muted">Asciara</text>
  <text x="42" y="320" class="small muted">three branches · one body of work</text>
</svg>
