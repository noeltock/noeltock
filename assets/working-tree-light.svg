<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Noel Tock's working tree</title>
  <desc id="desc">Three labeled branches for agents, WordPress, and creative work connect to Prompt Relay, Block Runner, Aphelion, and Asciara.</desc>
  <style>
    .ink { fill: #1f2328; } .muted { fill: #57606a; } .line { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .agent { fill: #0969da; stroke: #0969da; } .word { fill: #8250df; stroke: #8250df; } .creative { fill: #bf8700; stroke: #bf8700; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; } .small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .08em; }
    .glyph { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; opacity: .42; } .signal { animation: wander 12s ease-in-out infinite; }
    @keyframes wander { 0%, 14% { transform: translateX(0); } 48%, 62% { transform: translateX(760px); } 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <rect width="960" height="240" fill="#f6f8fa"/>
  <text x="36" y="35" class="small muted">HEAD / noeltock</text><text x="36" y="60" class="label ink">working-tree/</text>
  <text x="802" y="35" class="glyph muted">. : + * : .</text>
  <path d="M48 128H912M180 128V84H382M472 128V172H670M754 128V84H912" class="line"/>
  <path d="M180 84H382" class="agent" fill="none" stroke-width="2"/><path d="M472 172H670" class="word" fill="none" stroke-width="2"/><path d="M754 84H912" class="creative" fill="none" stroke-width="2"/>
  <circle cx="180" cy="128" r="5" class="agent"/><circle cx="472" cy="128" r="5" class="word"/><circle cx="754" cy="128" r="5" class="creative"/>
  <circle cx="382" cy="84" r="4" class="agent"/><circle cx="670" cy="172" r="4" class="word"/><circle cx="912" cy="84" r="4" class="creative"/>
  <g class="signal"><rect x="54" y="125" width="18" height="6" class="agent"/></g>
  <text x="196" y="82" class="label ink">🤖 agents/</text><text x="196" y="105" class="label muted">Prompt Relay</text>
  <text x="488" y="170" class="label ink">🧱 wordpress/</text><text x="488" y="193" class="label muted">Block Runner · Aphelion</text>
  <text x="770" y="82" class="label ink">✨ creative/</text><text x="770" y="105" class="label muted">Asciara</text>
  <text x="36" y="218" class="small muted">three branches · one body of work</text>
</svg>
